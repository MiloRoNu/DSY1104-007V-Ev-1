<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario | ConFun</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body>
  <header class="site-header">
    <div class="h-container">
      <div class="brand">
        <a href="index.html">
          <img src="img/logo.png" alt="Logo de ConFun"  class="logo" width="200" height="75">
        </a>
      </div>
      <nav id="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="inicio-carrito">
        <a class="inicio-sesion" href="inicio-sesion.html">Iniciar sesión</a>
      <a class="carrito" href="carrito.html">🛒 Carrito <span>(</span><span id="carrito-cantidad">0</span><span>)</span></a> 
      </div>
    </div>
  </header>
  <main>
    <div class="login">
      <div class="login-box">
        <h2>Crear cuenta</h2>
        <br>
        <form id="form-register">
          <div class="form-group">
            <label for="new-user">Elige un Usuario:</label>
            <input type="text" id="new-user" required>
          </div>
          <div class="form-group">
            <label for="new-pass">Contraseña:</label>
            <input type="password" id="new-pass" required>
          </div>
          <button type="submit" class="buy-button">Registrarse</button>
        </form>
        <p id="message"></p>
        <br>
        <p>¿Ya tienes cuenta? <a href="inicio-sesion.html">Inicia sesión</a></p>
      </div>
      
    </div>
    <br>
  </main>
  <footer>
    <div class="f-container">
      <div class="footer-content">
        <nav id="footer-nav" aria-label="Navegación del pie de página">

        </nav>

    </div>
